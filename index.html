<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Global Talent Club Platform Trial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Plan: graphite + bold blue, as on tlnt.one. Unbounded for display, Manrope for everything else.
   Layout: a thin trial bar on top, then one of three surfaces: client platform, law firm portal, CRM. Single light theme by choice. */
:root{
  --graphite:#4b4c52;
  --graphite-deep:#2b2c31;
  --ink:#1f2129;
  --ink-2:#31343f;
  --muted:#6a6e7b;
  --line:#e2e4ea;
  --paper:#f5f6f9;
  --card:#ffffff;
  --blue:#0942ed;
  --blue-soft:#5b86f5;
  --blue-tint:rgba(9,66,237,.08);
  --good:#178a4c;
  --good-tint:#e5f5ec;
  --warn:#a86b00;
  --warn-tint:#fdf2dc;
  --bad:#c93434;
  --bad-tint:#fbe7e7;
  --display:'Unbounded','Arial Black',system-ui,sans-serif;
  --body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --radius:18px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:22px}
h3{font-size:16px}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(9,66,237,.45);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:13px}
.tabnum{font-variant-numeric:tabular-nums}

/* Trial bar */
.trialbar{position:sticky;top:0;z-index:40;background:var(--graphite-deep);color:#fff;font-size:13px}
.trialbar .wrap{display:flex;align-items:center;gap:14px;min-height:44px;flex-wrap:wrap}
.trialtag{background:rgba(255,255,255,.12);border-radius:999px;padding:3px 10px;font-weight:700;letter-spacing:.02em}
.trialbar nav{display:flex;gap:4px;flex-wrap:wrap}
.trialbar nav a{color:rgba(255,255,255,.75);text-decoration:none;padding:6px 12px;border-radius:999px;font-weight:600}
.trialbar nav a.on{background:#fff;color:var(--ink)}
.trialbar nav a:hover:not(.on){color:#fff;background:rgba(255,255,255,.08)}
.dbstate{display:flex;align-items:center;gap:6px;color:rgba(255,255,255,.75)}
.dot{width:8px;height:8px;border-radius:50%;background:#999;display:inline-block}
.dot.ok{background:#3ccf7f}.dot.wait{background:#f0b429}.dot.bad{background:#f05252}

/* Client header */
.chead{background:#fff;border-bottom:1px solid var(--line)}
.chead .wrap{display:flex;align-items:center;gap:16px;min-height:64px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand .mark{width:34px;height:34px;border-radius:50%;border:3px solid currentColor;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:14px}
.brand .words{font-weight:800;font-size:13px;line-height:1.05;text-transform:lowercase}
.brand .sub{font-size:11px;color:var(--muted);font-weight:600;text-transform:none}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langs button{border:0;background:none;padding:6px 12px;font-weight:700;font-size:12px;cursor:pointer}
.langs button.on{background:var(--ink);color:#fff}
.who{font-size:13px;color:var(--muted)}

/* Hero */
.hero{background:radial-gradient(120% 140% at 15% 0%,#6d6e74 0%,#4f5056 45%,#3a3b40 100%);color:#fff;padding:64px 0 56px}
.hero .wrap{display:grid;grid-template-columns:1.25fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,5.4vw,64px);letter-spacing:-.02em}
.hero h1 .blue{background:linear-gradient(90deg,#7ea0ff,#2f5cf3 60%,#0942ed);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:18px;color:rgba(255,255,255,.88);margin-top:18px;max-width:560px}
.hero .ctas{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.glass{background:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.28);border-radius:28px;padding:26px;box-shadow:0 20px 50px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.3);backdrop-filter:blur(8px)}
.glass ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.glass li{display:flex;gap:12px;align-items:flex-start}
.glass .n{font-family:var(--display);font-size:13px;background:#fff;color:var(--blue);border-radius:50%;width:28px;height:28px;display:grid;place-items:center;flex:none}
.how{padding:48px 0}
.how h2{font-size:28px;margin-bottom:20px}
.how .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.how .item{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.how .item .k{font-family:var(--display);color:var(--blue);font-size:13px}
.how .item h3{margin:8px 0 6px}
.disclaimer{border-left:3px solid var(--blue);padding:10px 14px;background:#fff;border-radius:0 12px 12px 0;color:var(--ink-2);font-size:14px;max-width:820px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;text-decoration:none;background:#fff;color:var(--ink);border-color:var(--line);transition:transform .08s ease,background .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.light{background:#fff;color:var(--ink);border-color:#fff}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.5);color:#fff}
.btn.link{border:0;background:none;padding:6px 8px;color:var(--blue)}
.btn.sm{padding:7px 14px;font-size:13px}
.btn.danger{color:var(--bad);border-color:#f0c4c4}
.btn.block{width:100%}

/* App */
.appwrap{padding:28px 0 64px}
.stepper{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.step{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px;border-radius:999px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px;cursor:pointer;color:var(--muted)}
.step .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--paper);font-family:var(--display);font-size:12px}
.step.on{border-color:var(--blue);color:var(--ink)}
.step.on .num{background:var(--blue);color:#fff}
.step.done .num{background:var(--good-tint);color:var(--good)}
.step[disabled]{cursor:not-allowed;opacity:.6}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:0 1px 2px rgba(20,22,40,.04)}
.card.tint{background:var(--blue-tint);border-color:rgba(9,66,237,.18)}
.card h2 + .lead,.card h3 + p{margin-top:6px}
.lead{color:var(--ink-2)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.field label,.field legend{font-weight:700;font-size:13px}
fieldset.field{border:0;padding:0;margin-inline:0}
input[type=text],input[type=url],input[type=email],input[type=month],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
textarea{resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(9,66,237,.15)}
.hint{font-size:12.5px;color:var(--muted)}
.hint.ok{color:var(--good)}
.err{color:var(--bad);font-size:13px;margin-top:8px}
.drop{display:flex;align-items:center;gap:12px;border:1.5px dashed #c7cbd6;border-radius:14px;padding:16px;background:#fafbfd;cursor:pointer}
.drop input{max-width:100%}
.radios{display:flex;gap:16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--blue);flex:none}
.req{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-left:4px}
details summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--blue);margin-top:14px}
details textarea{margin-top:8px}
.navrow{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin-top:12px;font-size:14px}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0}
.routebox{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.routebox .big{font-family:var(--display);font-size:20px}
.list{display:grid;gap:10px;margin-top:12px}
.ritem{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.ritem .body{flex:1;min-width:0}
.ritem .title{font-weight:700}
.ritem .meta{font-size:13px;color:var(--muted)}
.checks{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.checks li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.ic{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.ic.ok{background:var(--good-tint);color:var(--good)}
.ic.no{background:var(--warn-tint);color:var(--warn)}
.rules{margin:10px 0 0;padding-left:18px;display:grid;gap:6px;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.green{background:var(--good-tint);color:var(--good)}
.pill.yellow{background:var(--warn-tint);color:var(--warn)}
.pill.red{background:var(--bad-tint);color:var(--bad)}
.pill.grey,.pill.pending{background:var(--paper);color:var(--muted)}
.pill.blue{background:var(--blue-tint);color:var(--blue)}
.pill.plain::before{display:none}
.evrow{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff;display:grid;gap:8px}
.evrow .top{display:flex;gap:10px;align-items:flex-start}
.evrow .checksline{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;font-size:13px}
.req-card{display:flex;gap:12px;align-items:center;border:1px dashed rgba(9,66,237,.35);border-radius:14px;padding:12px 14px;background:#fff}
.req-card p{flex:1;font-size:14px}
.side .card + .card{margin-top:16px}
.timeline{list-style:none;padding:0;margin:12px 0 0;display:grid;gap:0}
.timeline li{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:14px}
.timeline li:not(:last-child)::after{content:"";position:absolute;left:9px;top:22px;bottom:0;width:2px;background:var(--line)}
.timeline .ic{z-index:1}
.timeline .ic.cur{background:var(--blue);color:#fff}
.timeline .ic.todo{background:var(--paper);color:var(--muted)}
.offers{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin-top:12px}
.offer{border:1px solid var(--line);border-radius:16px;padding:18px;background:#fff;display:flex;flex-direction:column;gap:10px}
.offer.chosen{border-color:var(--blue);box-shadow:0 0 0 3px rgba(9,66,237,.12)}
.offer .fee{font-family:var(--display);font-size:24px}
.success{text-align:left;background:linear-gradient(135deg,#0942ed,#3a6af5);color:#fff;border:0}
.success h2{color:#fff}
.success p{color:rgba(255,255,255,.92)}
.banner{background:var(--warn-tint);color:#6b4700;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:16px}

/* Modal + drawer */
.backdrop{position:fixed;inset:0;background:rgba(20,22,32,.45);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
.modal{background:#fff;border-radius:22px;max-width:560px;width:100%;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.modal.wide{max-width:760px}
.modal h2{font-size:20px}
.sso{display:grid;gap:10px;margin-top:18px}
.sso .btn{justify-content:flex-start;padding:13px 18px;border-color:#d5d8e0}
.sso .ico{width:22px;height:22px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;margin:18px 0 4px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.drawer-bg{position:fixed;inset:0;background:rgba(20,22,32,.35);z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:#fff;z-index:51;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.2)}
.drawer .head{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--line);padding:18px 22px;display:flex;gap:12px;align-items:center;z-index:2}
.drawer .sec{padding:18px 22px;border-bottom:1px solid var(--line)}
.drawer .sec h3{font-size:14px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90vw}

/* CRM + firm portal */
.ophead{padding:26px 0 8px}
.ophead h1{font-size:28px}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:18px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.kpi .v{font-family:var(--display);font-size:26px}
.kpi .l{font-size:12.5px;color:var(--muted);font-weight:600}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:10px 14px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--ink);border-color:var(--blue)}
.tablewrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafbfd;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:#f7f9ff}
td select{padding:6px 8px;border-radius:8px;font-size:13px;width:auto}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{width:auto;min-width:200px}
.empty{padding:28px;text-align:center;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mail{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:#fff}
.mail .subj{font-weight:700}
.mail pre{white-space:pre-wrap;font-family:var(--body);font-size:13px;margin:8px 0 0;color:var(--ink-2)}
.firmlist{display:grid;gap:10px}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
.spin.dark{border-color:rgba(0,0,0,.15);border-top-color:var(--blue)}
@keyframes sp{to{transform:rotate(360deg)}}

/* Sign-in, lookups, autofill */
.gbtn{min-height:44px;display:flex;justify-content:center;align-items:center;margin-top:20px}
.me{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:16px;background:#fafbfd}
.ava{width:40px;height:40px;border-radius:50%;background:var(--paper);flex:none;display:inline-grid;place-items:center;font-weight:800;color:var(--muted);border:1px solid var(--line);position:relative;overflow:hidden}
.ava img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ava.sm{width:28px;height:28px;font-size:12px}
.ava.lg{width:60px;height:60px;font-size:20px}
.lookup{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap;margin-top:16px}
.lookup input{flex:1;min-width:220px;font-size:16px;padding:12px 14px}
.auto{display:inline-block;font-size:10.5px;font-weight:800;color:var(--good);background:var(--good-tint);border-radius:999px;padding:2px 8px;margin-left:6px;text-transform:uppercase;letter-spacing:.04em;vertical-align:middle}
.pcard{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;background:#fff}
.pcard .body{flex:1;min-width:0}
.dropzone{border:1.5px dashed #c7cbd6;border-radius:16px;padding:24px 16px;text-align:center;background:#fafbfd;cursor:pointer;display:block;margin-top:16px}
.dropzone.over{border-color:var(--blue);background:var(--blue-tint)}
.dropzone input{position:absolute;width:1px;height:1px;opacity:0}
.dropzone .files{margin-top:8px;font-size:13px;color:var(--ink-2)}
.evrow .inl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.list > *{min-width:0}
.evrow{grid-template-columns:minmax(0,1fr)}
.evrow .inl select{flex:0 1 auto;width:auto;min-width:0;max-width:100%;padding:5px 8px;border-radius:8px;font-size:12.5px;text-overflow:ellipsis}
.evrow .inl input{padding:6px 10px;border-radius:8px;font-size:13px;flex:1 1 200px;min-width:0}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.setup code{background:var(--paper);border-radius:6px;padding:1px 6px;font-size:12.5px}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.btn{transition:none}}
@media (max-width:900px){
  .hero .wrap,.cols{grid-template-columns:1fr}
  .how .grid{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:520px){
  .how .grid,.grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kv{grid-template-columns:1fr}
  .card{padding:18px}
}
</style>
</head>
<body>
<div id="bar"></div>
<main id="view"></main>
<div id="modal"></div>
<div id="toast"></div>

<script>
'use strict';
/* ---------- Constants ---------- */
const ROUTES = {
  tech:{min:3, en:{name:'Digital technology', body:'Tech Nation'}, ru:{name:'Цифровые технологии', body:'Tech Nation'}, rules:'tech', checks:['orgs3','months12'], cats:['innovation','recognition','contribution','academic','business']},
  ace:{min:3, en:{name:'Arts and culture', body:'Arts Council England'}, ru:{name:'Искусство и культура', body:'Arts Council England'}, rules:'arts', checks:['orgs2','uk1'], cats:['media','awards','appearances','distribution']},
  bfc:{min:3, en:{name:'Fashion', body:'British Fashion Council, via Arts Council England'}, ru:{name:'Мода', body:'British Fashion Council, через Arts Council England'}, rules:'arts', checks:['orgs2','uk1'], cats:['media','awards','appearances','distribution']},
  pact:{min:3, en:{name:'Film and television', body:'PACT, via Arts Council England'}, ru:{name:'Кино и телевидение', body:'PACT, через Arts Council England'}, rules:'artsAward', checks:['orgs2','uk1'], cats:['media','awards','appearances','distribution']},
  riba:{min:3, en:{name:'Architecture', body:'RIBA, via Arts Council England'}, ru:{name:'Архитектура', body:'RIBA, через Arts Council England'}, rules:'artsAward', checks:['orgs2','uk1'], cats:['media','awards','appearances','distribution']},

async function checkApi(){

  if (S.sample && S.sample._worker) S.sample = null;
  if (!base) { S.apiChecked = true; scheduleRender(); return; }
  try {
    const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 12000);
    const r = await fetch(base + '/health', {signal: ctl.signal}); clearTimeout(tm);
    const d = await r.json(); S.api = {...d, ok: !!(d && d.ok)};
  } catch(e) { S.api = {ok: false, error: true}; }
  S.apiChecked = true;
  if (S.api.ai && !S.sample) S.sample = {_worker: true, json: (prompt, o) => api('/ai', {prompt, tier: o && o.modelTier === 'quick' ? 'quick' : 'default'})};
  scheduleRender();
}
async function api(path, body, retried){
  const base = cfg('apiBase'); if (!base) throw {code: 'not_configured'};
  const headers = {'Content-Type': 'application/json'};
  const tok = gToken(); if (tok) headers.Authorization = 'Bearer ' + tok;
  const ctl = new AbortController(); const tm = setTimeout(() => ctl.abort(), 150000);
  let res;
  try { res = await fetch(base + path, {method: 'POST', headers, body: JSON.stringify(body || {}), signal: ctl.signal}); }
  catch(e) { throw {code: e && e.name === 'AbortError' ? 'timeout' : 'network'}; }
  finally { clearTimeout(tm); }
  let data = null; try { data = await res.json(); } catch(e) {}
  if (res.status === 401 && !retried) { const t2 = await reauth(); if (t2) return api(path, body, true); throw {code: 'auth_required'}; }
  if (!res.ok) throw {code: (data && data.error) || 'http_' + res.status, detail: data && data.detail};
  return data;
}

const GIS_SRC = 'https://accounts.google.com/gsi/client';
const PRIVACY_URL = 'https://hylaspart.github.io/gtc-platform/privacy.html';
let gisInit = null;
function jwtPayload(tok){ try { const b = String(tok).split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b + '==='.slice((b.length + 3) % 4)), c => c.charCodeAt(0)))); } catch(e) { return null; } }
function gAuth(){ if (S.gauth === undefined) { try { S.gauth = JSON.parse(lsGet('gtc_gauth') || 'null'); } catch(e) { S.gauth = null; } } return S.gauth; }
function gToken(){ const a = gAuth(); return a && a.credential && a.exp > Date.now() + 30000 ? a.credential : ''; }
function googleOn(){ return !!cfg('googleClientId') && !!S.standalone; }
function gisLoad(){
  if (!gisInit) gisInit = loadScript(GIS_SRC).then(() => {
    if (!window.google || !google.accounts || !google.accounts.id) throw new Error('gis');
    google.accounts.id.initialize({client_id: cfg('googleClientId'), callback: onGoogle, auto_select: false, cancel_on_tap_outside: true, context: 'signup', itp_support: true});
  }).catch(e => { gisInit = null; throw e; });
  return gisInit;
}
function mountGoogle(el, text){
  if (!el) return;
  if (!googleOn()) { el.innerHTML = S.standalone ? `<p class="hint" style="text-align:center">${esc(t('gNotSet'))}</p>` : ''; return; }
  el.innerHTML = spin(true);
  gisLoad().then(() => {
    if (!el.isConnected) return;
    el.innerHTML = '';
    google.accounts.id.renderButton(el, {type: 'standard', theme: 'outline', size: 'large', shape: 'pill', text: text || 'continue_with', logo_alignment: 'left', width: Math.max(240, Math.min(380, (el.clientWidth || 320) - 4)), locale: S.lang});
  }).catch(() => { if (el.isConnected) el.innerHTML = `<p class="err">${esc(t('gFail'))}</p>`; });
}
function onGoogle(resp){
  const p = jwtPayload(resp && resp.credential);
  if (!p || !p.email) { toast(t('gFail')); return; }
  S.gauth = {credential: resp.credential, exp: (p.exp || 0) * 1000, sub: p.sub || '', email: p.email, name: p.name || [p.given_name, p.family_name].filter(Boolean).join(' ') || p.email.split('@')[0], picture: p.picture || ''};
  lsSet('gtc_gauth', JSON.stringify(S.gauth));
  if (S.reauth) { const r = S.reauth; S.reauth = null; closeModal(); r(S.gauth.credential); return; }
  afterSignIn({provider: 'google', name: S.gauth.name, email: S.gauth.email, photo: S.gauth.picture, sub: S.gauth.sub});
}
function reauth(){
  if (!googleOn()) return Promise.resolve('');
  return new Promise(res => {
    S.reauth = res;
    openModal(`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="rat"><h2 id="rat">${esc(t('reauthT'))}</h2><p class="muted" style="margin-top:6px">${esc(t('reauthB'))}</p><div class="gbtn" id="gbtn"></div><div class="navrow"><button class="btn" data-act="closeModal">${esc(t('cancel'))}</button><span></span></div></div>`);

  });
}

    offer: ru ? ['Новое предложение от ' + firm, `Здравствуйте, ${c.name}!\n\n${firm} прислали предложение по вашему делу. Сравните его с другими в вашем кабинете.\n\nGlobal Talent Club`]
             : ['New offer from ' + firm, `Hi ${c.name},\n\n${firm} has sent an offer for your case. Compare it with the others in your account.\n\nGlobal Talent Club`],
    chosen_client: ru ? ['Знакомим вас с ' + firm, `Здравствуйте, ${c.name}!\n\nВы выбрали ${firm}. Фирма свяжется с вами, пришлёт договор и будет вести ваше дело.\n\nGlobal Talent Club`]
                      : ['Introducing you to ' + firm, `Hi ${c.name},\n\nYou chose ${firm}. They will contact you, send their client care letter and run your case from here.\n\nGlobal Talent Club`],
    chosen_firm: ['Client chose your firm: ' + c.name, `Dear ${firm},\n\n${c.name} (${c.email}) has chosen your firm. Please contact them to start onboarding.\n\nGlobal Talent Club`],
    chosen_admin: ['Firm chosen: ' + c.name + ' with ' + firm, `${c.name} chose ${firm}.`],

    closed: ['File closed: ' + c.name, `${c.name} closed their file.`]
  }[kind];
  const to = ['welcome','submitted','offer','chosen_client'].includes(kind) ? c.email : (x.firm ? (x.firm.contact || x.firm.name) : 'Platform team');
  return {id: uid(), kind, to, subject: T[0], body: T[1], at: Date.now()};
}

function refChecks(c){
  const r = ROUTES[c.route]; const refs = c.referees || []; const out = [];
  if (!r || !r.min) return out;
  out.push({ok: refs.length >= r.min, txt: t('chkMin', {n: r.min, have: refs.length})});
  const orgs = new Set(refs.map(x => (x.org || '').trim().toLowerCase()).filter(Boolean)).size;
  if (r.checks.includes('orgs3')) out.push({ok: orgs >= 3, txt: t('chkOrgs3', {have: orgs})});
  if (r.checks.includes('orgs2')) out.push({ok: orgs >= 2, txt: t('chkOrgs2', {have: orgs})});
  if (r.checks.includes('uk1')) out.push({ok: refs.some(isUK), txt: t('chkUk1')});
  if (r.checks.includes('uk2')) { const n = refs.filter(isUK).length; out.push({ok: n >= 2, txt: t('chkUk2', {have: n})}); }
  if (r.checks.includes('months12')) { const n = refs.filter(x => monthsSince(x.since) >= 12).length; out.push({ok: n >= 3, txt: t('chkM12', {have: n})}); }
  return out;
}
const refOk = c => { const r = ROUTES[c.route]; if (!r) return false; if (!r.min) return true; return refChecks(c).every(x => x.ok); };

function step2(c){
  const r = ROUTES[c.route] || {min: 0};

  const checks = refChecks(c);
  return `<div class="cols"><div class="stack">
    <section class="card">
      <h2>${esc(t('s2Title'))}</h2>
      <p class="lead" style="margin-top:6px">${esc(t('s2Lead', {route: routeName(c.route), n: r.min}))} ${esc(t('s2More'))}</p>
      <div class="list">
        ${refs.map(x => `<div class="ritem">${avatar(x.photo, x.name)}<div class="body">

  if (e.size > 25 * 1024 * 1024) return M('Over 25MB. Compress or split it.', 'Больше 25 МБ. Сожмите или разделите файл.', 'yellow');

}
async function saveEv(form){

/* ---------- AI: profile ---------- */
async function analyse(){
  const c = cur();
  const text = [c.li ? 'LINKEDIN PROFILE\n' + [c.li.name, c.li.headline, c.li.location].filter(Boolean).join(' | ') + '\n' + liText(c.li) : '', c.cv && c.cv.text || '', c.pasted || '', c.linkedinUrl ? 'LinkedIn: ' + c.linkedinUrl : ''].filter(Boolean).join('\n\n');
  if (text.replace(/LinkedIn:.*/, '').trim().length < 40) { S.aiError = t('needText'); scheduleRender(); return; }
  if (!S.sample) { S.noAI = true; S.aiError = t('noAI'); scheduleRender(); return; }
  S.busy.analyse = true; S.aiError = ''; scheduleRender();
  const catMap = Object.fromEntries(Object.entries(ROUTES).map(([k, r]) => [k, r.cats]));
  const prompt = `You help a UK Global Talent visa intake platform COLLECT information for a regulated UK law firm.
You must NOT assess eligibility, strength or chances, and must not say whether the person qualifies.
Read the profile text below and reply with ONLY one JSON object of this shape:
{"name":string,"headline":string,"location":string,
 "roles":[{"title":string,"org":string,"from":string,"to":string}],
 "founded":[string],"publications":[string],"awards":[string],"media":[string],"talks":[string],"judging":[string],"patents":[string],"open_source":[string],"other_highlights":[string],
 "field":"tech"|"ace"|"bfc"|"pact"|"riba"|"dba"|"research"|"fasttrack"|"prize",
 "field_reason_en":string,"field_reason_ru":string,
 "requests":[{"category":string,"text_en":string,"text_ru":string}]}
Field guide (by the area the person works in, as published by the endorsing bodies): tech = digital technology (software, product, data, AI, fintech, tech founders or investors); ace = arts and culture (music, dance, theatre, visual arts, literature, museums, combined arts); bfc = fashion design; pact = film and television; riba = architecture; dba = design (product, graphic, digital design); research = academic or research career, peer review route; fasttrack = already holds a listed fellowship, an approved academic or research post, or a UKRI-funded role; prize = named winner of a major international prize, only if clearly stated.
field_reason_*: one factual sentence on which area their work is in. No judgement of strength.
requests: up to 7 specific documents to ask for, each tied to something the text mentions, phrased as a polite request to upload proof, e.g. "Your CV mentions a talk at Web Summit 2025: upload the programme page or the invitation." Use a category key allowed for the chosen field: ${JSON.stringify(catMap)}.
Use only facts in the text. At most 6 items per list, each under 15 words. All fields in English except *_ru, which are in Russian.
PROFILE TEXT:
<<<
${text.slice(0, 30000)}
>>>`;
  try {
    const res = await S.sample.json(prompt, {modelTier: 'default'});
    if (!res || typeof res !== 'object') throw {code: 'invalid_json'};
    const roles = Array.isArray(res.roles) ? res.roles.slice(0, 8).map(r => ({title: str(r && r.title, 120), org: str(r && r.org, 120), from: str(r && r.from, 30), to: str(r && r.to, 30)})) : [];
    const prof = {name: str(res.name, 120), headline: str(res.headline, 200), location: str(res.location, 120), roles};
    ['founded','publications','awards','media','talks','judging','patents','open_source','other_highlights'].forEach(k => prof[k] = arr(res[k], 6));
    const field = ROUTES[res.field] ? res.field : 'tech';
    const allowed = ROUTES[field].cats;
    const requests = (Array.isArray(res.requests) ? res.requests : []).slice(0, 7).map(q => ({id: uid(), category: allowed.includes(q && q.category) ? q.category : allowed[0], en: str(q && q.text_en, 240), ru: str(q && q.text_ru, 240) || str(q && q.text_en, 240), done: false})).filter(q => q.en);
    const c2 = cur();
    if (c2.li) { prof.photo = c2.profile && c2.profile.photo || ''; Object.keys(c2.profile || {}).forEach(k => { if (Array.isArray(c2.profile[k]) && c2.profile[k].length) prof[k] = c2.profile[k]; else if (!prof[k] && c2.profile[k]) prof[k] = c2.profile[k]; }); }
    updClient(c2.id, {profile: prof, routeSuggested: field, route: c2.routeConfirmedAt ? c2.route : field, routeReason: {en: str(res.field_reason_en, 300), ru: str(res.field_reason_ru, 300)}, requests, ...stageAtLeast(c2, 'Collecting'),
      crm: {...(c2.crm || {}), nextAction: c2.crm && c2.crm.nextAction && !/Step 1/.test(c2.crm.nextAction) ? c2.crm.nextAction : 'Follow up on referees and evidence'}});
    S.showRoutePick = false;
  } catch(e) {
    if (e && (e.code === 'not_granted' || e.code === 'sampling_disabled' || e.code === 'capability_disabled')) { S.noAI = true; S.aiError = t('noAI'); }
    else if (e && e.code === 'cancelled') { S.aiError = ''; }
    else { S.aiError = t('aiFail'); S.noAI = true; }
  } finally { S.busy.analyse = false; scheduleRender(); }
}

function loadScript(src){ return new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) { res(); return; } const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
const PDFW = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
async function pdfText(file, maxPages){
  await loadScript(PDFJS); await loadScript(PDFW);
  const lib = window.pdfjsLib; lib.GlobalWorkerOptions.workerSrc = PDFW;
  const doc = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer())}).promise;
  let out = ''; const n = Math.min(doc.numPages, maxPages || 30);
  for (let i = 1; i <= n; i++) { const p = await doc.getPage(i); const tc = await p.getTextContent(); out += tc.items.map(x => x.str).join(' ') + '\n'; }
  return out.replace(/[ \t]+/g, ' ').trim();
}
async function docxText(file){
  await loadScript('https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js');
  const r = await window.mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()});
  return (r.value || '').trim();
}
async function onCV(input){
  const c = cur(); const f = input.files[0]; if (!f) return;
  S.cvInfo = ''; S.busy.cv = true; scheduleRender();
  let text = '';
  try {
    if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf') text = await pdfText(f, 30);
    else if (/\.docx$/i.test(f.name)) text = await docxText(f);
    else text = await f.text();
  } catch(e) { text = ''; }
  const cv = {name: f.name, size: f.size, chars: text.length, text: text.slice(0, 40000), at: Date.now()};
  if (S.assets) {
    try {
      const isPdf = /\.pdf$/i.test(f.name);
      const up = isPdf ? await S.assets.upload(f, {type: 'application/pdf'}) : await S.assets.upload(new Blob([text || ' '], {type: 'text/plain'}), {type: 'text/plain'});
      cv.assetId = up.id;
    } catch(e) {}
  }
  if (!text) S.cvInfo = t('cvFail');
  S.busy.cv = false;
  await updClient(c.id, {cv, ...stageAtLeast(c, 'Collecting')});
  if (text) applyCvText(c.id);
}

function saveOffer(form){
  const c = S.clients[form.dataset.id]; const f = S.firms[S.firmId];
  const take = (form.querySelector('input[name=o_take]:checked') || {}).value !== 'no';
  const fee = Number($('#o_fee').value || 0);
  if (take && !fee) { $('#o_err').textContent = 'Enter your fee.'; return; }
  const prev = (c.offers || {})[f.id];
  const offer = {firmId: f.id, firmName: f.name, take, fee, view: $('#o_view').value, scope: $('#o_scope').value.trim(), timeline: $('#o_tl').value.trim(), notes: $('#o_notes').value.trim(), at: prev ? prev.at : Date.now(), updatedAt: Date.now()};
  const patch = {offers: {...(c.offers || {}), [f.id]: offer}};
  if (!prev) patch.emails = [...(c.emails || []), mkEmail(c, 'offer', {firm: f})];
  closeModal(); updClient(c.id, patch); toast('Offer sent to ' + c.name);
}

function confirmChoose(fid){
  const c = cur(); const f = S.firms[fid] || {id: fid, name: ((c.offers || {})[fid] || {}).firmName || 'Firm'};
  const emails = [...(c.emails || []), mkEmail(c, 'chosen_client', {firm: f}), mkEmail(c, 'chosen_firm', {firm: f}), mkEmail(c, 'chosen_admin', {firm: f})];
  closeModal(); S.justSubmitted = false;

function crmFirms(){

  return `<div class="row" style="margin-bottom:12px"><p class="muted small">Every submitted file goes to every active firm. Firms pay a fixed panel fee; the weekly commitment counts files shared, not clients won.</p><span class="spacer"></span><button class="btn primary sm" data-act="firmModal">Add firm</button></div>
  <div class="tablewrap"><table><thead><tr><th>Firm</th><th>Regulator</th><th>Panel fee</th><th>Weekly commitment</th><th>Files shared, last 7 days</th><th>Offers sent</th><th>Avg reply</th><th>Clients won</th><th>Status</th><th></th></tr></thead><tbody>
  ${firmsArr().map(f => { const os = all.map(c => [(c.offers || {})[f.id], c]).filter(([o]) => o); const avg = os.length ? os.reduce((s, [o, c]) => s + hoursBetween(c.submittedAt || o.at, o.at), 0) / os.length : null; const sh = shared.filter(c => (c.sharedWith || []).includes(f.id)).length; const won = all.filter(c => c.chosenFirmId === f.id).length; const wk = Number(f.weekly || 0);

const BLOBS = {};
function blobHref(id){ if (!id) return ''; return S.standalone ? (BLOBS[id] || '') : '/_blob/' + id; }
const LKEY = 'gtc_trial_store_v1';
function makeLocalDB(){
  let store = {};
  try { store = JSON.parse(localStorage.getItem(LKEY) || '{}') || {}; } catch(e) { store = {}; }
  const listeners = [];
  const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
  const merge = (a, b) => { const o = {...a}; for (const k in b) o[k] = isObj(b[k]) && isObj(a[k]) ? merge(a[k], b[k]) : b[k]; return o; };
  const copy = o => JSON.parse(JSON.stringify(o));
  const persist = () => { try { localStorage.setItem(LKEY, JSON.stringify(store)); } catch(e) { toast('Browser storage is full. Use Reset demo data in the CRM.'); } };
  const snapDoc = path => { const d = store[path]; return {id: path.split('/').pop(), exists: !!d, data: () => d ? copy(d) : undefined, metadata: {fromCache: false, hasPendingWrites: false}}; };
  const colDocs = col => Object.keys(store).filter(p => p.startsWith(col + '/') && p.split('/').length === col.split('/').length + 1).map(snapDoc);
  const qs = col => { const docs = colDocs(col); return {docs, size: docs.length, empty: !docs.length, docChanges: () => [], metadata: {fromCache: false, hasPendingWrites: false}}; };
  const notify = () => setTimeout(() => listeners.forEach(l => l.kind === 'col' ? l.next(qs(l.path)) : l.next(snapDoc(l.path))), 0);
  window.addEventListener('storage', e => { if (e.key === LKEY) { try { store = JSON.parse(e.newValue || '{}') || {}; } catch(x) { store = {}; } notify(); } });
  const docRef = path => ({id: path.split('/').pop(), path,
    get: async () => snapDoc(path),
    set: async d => { store[path] = copy(d); persist(); notify(); },
    update: async d => { if (!store[path]) throw {code: 'invalid_argument'}; store[path] = merge(store[path], copy(d)); persist(); notify(); },
    delete: async () => { delete store[path]; persist(); notify(); },
    onSnapshot: next => { const l = {kind: 'doc', path, next}; listeners.push(l); setTimeout(() => next(snapDoc(path)), 0); return () => { const i = listeners.indexOf(l); if (i > -1) listeners.splice(i, 1); }; }
  });
  const colRef = path => ({path,
    doc: id => docRef(path + '/' + (id || uid())),
    add: async d => { const r = docRef(path + '/' + uid()); await r.set(d); return r; },
    onSnapshot: next => { const l = {kind: 'col', path, next}; listeners.push(l); setTimeout(() => next(qs(path)), 0); return () => { const i = listeners.indexOf(l); if (i > -1) listeners.splice(i, 1); }; }
  });

function idb(){ return new Promise((res, rej) => { try { const r = indexedDB.open('gtc_trial_files', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); } catch(e) { rej(e); } }); }
async function makeLocalAssets(){
  let d; try { d = await idb(); } catch(e) { return null; }
  const tx = (mode, fn) => new Promise((res, rej) => { const t = d.transaction('files', mode); const st = t.objectStore('files'); const out = fn(st); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error); });
  try {
    const keys = await tx('readonly', st => st.getAllKeys());
    for (const k of keys || []) { const b = await tx('readonly', st => st.get(k)); if (b) BLOBS[k] = URL.createObjectURL(b); }
  } catch(e) {}
  return {
    upload: async (blob, opts) => { const id = 'L' + uid() + uid(); const b = opts && opts.type && blob.type !== opts.type ? new Blob([blob], {type: opts.type}) : blob; await tx('readwrite', st => st.put(b, id)); BLOBS[id] = URL.createObjectURL(b); return {id, url: BLOBS[id], sizeBytes: b.size, contentType: b.type}; },
    remove: async id => { await tx('readwrite', st => st.delete(id)); if (BLOBS[id]) { URL.revokeObjectURL(BLOBS[id]); delete BLOBS[id]; } },
    _clear: async () => { await tx('readwrite', st => st.clear()); Object.keys(BLOBS).forEach(k => { URL.revokeObjectURL(BLOBS[k]); delete BLOBS[k]; }); }
  };
}

async function startStandalone(){
  S.standalone = true; S.dbState = 'local';
  S.db = makeLocalDB();
  S.assets = await makeLocalAssets();
  S.sample = null; S.downloads = null; S.user = null; S.noAI = false;
  if (S.db._isEmpty()) S.db._seed(sampleData());
}
async function resetLocal(){
  if (!S.standalone) return;
  try { if (S.assets && S.assets._clear) await S.assets._clear(); } catch(e) {}
  S.db._clear(); S.db._seed(sampleData());
  S.currentId = null; lsSet('gtc_client', null); S.drawerId = null; S.firmOpen = null;
  toast('Demo data reset.'); go('crm');

function subscribeAll(db){
  const slow = setTimeout(() => { if (S.dbState === 'connecting') { S.dbState = 'slow'; scheduleRender(); } }, 10000);
  db.collection('clients').onSnapshot(snap => {
    const m = {};
    snap.docs.forEach(d => { if (!d.exists) return; const x = {...d.data(), id: d.id}; const p = pend[d.id]; if (p) for (const k in p) x[k] = p[k].v; m[d.id] = x; });
    for (const id in pend) if (!m[id] && S.clients[id] && Object.keys(pend[id]).length) m[id] = S.clients[id];
    creating.forEach(id => { if (!m[id] && S.clients[id]) m[id] = S.clients[id]; });
    S.clients = m; S.loaded.clients = true;
    if (!snap.metadata.fromCache) { clearTimeout(slow); if (S.dbState !== 'local') S.dbState = 'live'; }
    if (S.view === 'app' && !cur()) { S.view = 'home'; }
    scheduleRender();
  }, () => { clearTimeout(slow); S.dbState = 'off'; scheduleRender(); });
  db.collection('firms').onSnapshot(snap => {
    const m = {}; snap.docs.forEach(d => { if (d.exists) m[d.id] = {...d.data(), id: d.id}; });
    S.firms = m; S.loaded.firms = true; scheduleRender();
  }, () => {});
}

(async function boot(){

  const [db, user, assets, sample, downloads] = await Promise.all([use('db'), use('user'), use('assets'), use('sample'), use('downloads')]);

  if (user) { try { const me = await user.me(); S.me = me ? {name: me.name || '', email: me.email || ''} : null; } catch(e) {} }
  if (!db) { S.dbState = 'off'; scheduleRender(); return; }
  subscribeAll(db); checkApi();
})();
